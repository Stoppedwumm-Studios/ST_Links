<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);

  if (!params.has("url")) {
    const currentUrl = window.location.href;
    window.location.replace("?url=" + encodeURIComponent(currentUrl));
  }
</script>
</body>
</html>
